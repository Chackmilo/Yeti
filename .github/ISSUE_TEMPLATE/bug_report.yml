name: 🐛 Reporte de Error (Bug Report)
description: Notifica un defecto o fallo en alguna de las ediciones de Otter Escape
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por tomarte el tiempo de reportar este problema. Completa los siguientes campos para ayudarnos a reproducirlo y solucionarlo.

  - type: dropdown
    id: edition
    attributes:
      label: Edición Afectada
      description: ¿En qué edición del videojuego ocurre el problema?
      options:
        - "3D PRO Modular (games/3d-pro)"
        - "3D Standalone (games/3d-standalone)"
        - "2D Retro Canvas (games/2d-retro)"
        - "Portal Hub (index.html)"
        - "Simulación Drosophila SNN (experiments/fly-brain)"
        - "Docker / Nginx / Despliegue"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Descripción del Problema
      description: Explica qué sucede de forma clara y concisa.
      placeholder: Describe qué ocurrió de manera inesperada...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para Reproducir
      description: ¿Cómo podemos reproducir este error paso a paso?
      value: |
        1. Abrir edición '...'
        2. Seleccionar modo '...'
        3. Realizar la acción '...'
        4. Observar el error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento Esperado
      description: ¿Qué debería haber ocurrido en su lugar?
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Entorno de Ejecución
      description: Navegador (versión), Sistema Operativo, Mando o Dispositivo Táctil.
      placeholder: Chrome 124 en Windows 11 / Gamepad Xbox One
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs de Consola o Telemetría
      description: Pega aquí los mensajes de error de la consola (F12) o telemetría (F2).
      render: shell
