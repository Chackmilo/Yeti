server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for fast delivery of scripts, styles and HTML
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Backward compatibility redirects from legacy routes
    rewrite ^/snowEscape2D\.html$ /games/2d-retro/index.html permanent;
    rewrite ^/yetiAstra\.html$ /games/3d-standalone/index.html permanent;
    rewrite ^/Pro/.*$ /games/3d-pro/dist/index.html permanent;

    # Main Hub and routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache immutable static assets (Three.js chunks, Vite bundles, audio, images, videos)
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|webp|ico|mp3|wav|ogg|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Ensure HTML entry points always fetch the newest versions
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Standard error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
